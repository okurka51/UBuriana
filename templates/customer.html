<!DOCTYPE html>
<html lang="cs">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{{ customer.name }} – U Buriana</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
    <link rel="stylesheet" href="{{ url_for('static', filename='tables.css') }}">
    <link rel="stylesheet" href="{{ url_for('static', filename='customer.css') }}">
</head>
<body>
    <header>
        <a href="{{ url_for('index') }}" class="brand">U Buriana</a>
    </header>

    <main>
        <div class="customer-layout">

            <section class="card customer-card">
                <div class="color-stripe" id="color-stripe" style="background: {{ customer.color }}"></div>

                <form method="post" action="{{ url_for('save_customer', customer_id=customer.id) }}" class="customer-info">
                    <h1 id="customer-heading">{{ customer.name }}</h1>

                    <label>
                        Jméno
                        <input type="text" name="name" value="{{ customer.name }}" required>
                    </label>

                    <label>
                        Barva
                        <span class="color-field">
                            <input type="color" id="color-picker" aria-label="Vybrat barvu">
                            <input type="text" name="color" id="color-text" value="{{ customer.color }}" required>
                        </span>
                    </label>

                    <button type="submit" class="save-button">Uložit</button>
                </form>

                <form method="post" action="{{ url_for('delete_customer', customer_id=customer.id) }}" class="delete-form"
                      data-confirm="Opravdu smazat zákazníka „{{ customer.name }}“? Smažou se i všechny jeho objednávky ({{ order_count }}). Tuto akci nelze vrátit.">
                    <button type="submit" class="danger-button">Smazat zákazníka</button>
                </form>
            </section>

            <form method="post" action="{{ url_for('save_orders', customer_id=customer.id) }}" class="card">
                <div class="orders-header">
                    <h2>Objednávky</h2>
                    <button type="submit" class="save-button">Uložit</button>
                </div>

                <div class="table-wrap">
                    <table id="order-table">
                        <thead>
                            <tr>
                                <th>Datum</th>
                                {% for item in menu_items %}
                                    <th title="{{ item.name or '' }}">{{ item.code }}</th>
                                {% endfor %}
                            </tr>
                        </thead>
                        <tbody>
                            {% for date, counts in rows %}
                                <tr class="{{ 'today' if date == today }}{{ ' past' if date < today }}">
                                    <td class="date-cell">
                                        <span class="weekday">{{ date | cz_weekday(short=True) }}</span>
                                        {{ date | cz_date }}
                                    </td>
                                    {% for item in menu_items %}
                                        <td>
                                            <input type="number" min="0" step="1"
                                                   class="count-input{{ ' zero' if counts[loop.index0] == 0 }}"
                                                   name="count:{{ date.isoformat() }}:{{ item.id }}"
                                                   value="{{ counts[loop.index0] }}">
                                        </td>
                                    {% endfor %}
                                </tr>
                            {% endfor %}
                        </tbody>
                    </table>
                </div>
            </form>

        </div>
    </main>

    <script>
        const stripe = document.getElementById("color-stripe");
        const picker = document.getElementById("color-picker");
        const text = document.getElementById("color-text");

        // convert any CSS color (e.g. "darkred") to #rrggbb for the picker
        function toHex(color) {
            const ctx = document.createElement("canvas").getContext("2d");
            ctx.fillStyle = "#000000";
            ctx.fillStyle = color;
            return ctx.fillStyle;
        }

        picker.value = toHex(text.value);
        picker.addEventListener("input", () => {
            text.value = picker.value;
            stripe.style.background = picker.value;
        });
        text.addEventListener("input", () => {
            stripe.style.background = text.value;
            picker.value = toHex(text.value);
        });

        document.querySelectorAll("form[data-confirm]").forEach(form => {
            form.addEventListener("submit", event => {
                if (!confirm(form.dataset.confirm)) event.preventDefault();
            });
        });

        document.querySelectorAll(".count-input").forEach(input => {
            input.addEventListener("focus", () => input.select());
            input.addEventListener("input", () => {
                input.classList.toggle("zero", !input.value || Number(input.value) === 0);
                input.classList.add("changed");
            });
        });
    </script>
</body>
</html>
